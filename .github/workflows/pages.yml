name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site root
        run: |
          mkdir -p _site
          cp -r ozcorapci.de _site/
          mkdir -p _site/boxring-wetterau.de
          cp -r boxring-wetterau.de/. _site/boxring-wetterau.de/
          mkdir -p _site/buerokollege-ai
          cp -r buerokollege-ai/. _site/buerokollege-ai/
          mkdir -p _site/aralia-ballroom.de
          cp -r aralia-ballroom.de/. _site/aralia-ballroom.de/
          mkdir -p _site/brw-sommerfest
          cp -r brw-sommerfest/. _site/brw-sommerfest/
          mkdir -p _site/cc-dienstleistungen-friedberg.de
          cp -r cc-dienstleistungen-friedberg.de/. _site/cc-dienstleistungen-friedberg.de/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
