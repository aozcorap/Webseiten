name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site root
        run: |
          mkdir -p _site
          cp -r ozcorapci.de _site/
          mkdir -p _site/boxring-wetterau.de
          cp -r boxring-wetterau.de/. _site/boxring-wetterau.de/
          mkdir -p _site/everlast-ai-v2
          cp -r everlast-ai-v2/. _site/everlast-ai-v2/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
